<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adrogames Nexus | Panel de Gestión Corporativa</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --ad-bg: #060409;
            --ad-card: #110d1a;
            --ad-dark: #020104;
            --ad-accent: #a855f7;
            --ad-rojo: #ef4444;
            --ad-verde: #10b981;
            --ad-texto: #f3f4f6;
            --ad-gris: #9ca3af;
            --ad-borde: #251c36;
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--ad-bg);
            color: var(--ad-texto);
        }

        /* Header Corporativo */
        .nexus-header {
            background: var(--ad-dark);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--ad-accent);
            box-shadow: 0 4px 25px rgba(0,0,0,0.6);
            position: sticky; top: 0; z-index: 100;
        }
        .brand-logo {
            font-size: 1.6rem;
            font-weight: 900;
            letter-spacing: -1px;
            color: #fff;
            text-decoration: none;
            text-transform: uppercase;
        }
        .brand-logo span { color: var(--ad-accent); text-shadow: 0 0 10px rgba(168, 85, 247, 0.5); }
        .sub-logo { font-size: 0.8rem; color: var(--ad-gris); font-weight: 700; letter-spacing: 2px; }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
            box-sizing: border-box;
        }

        /* Sistema de Pestañas / Menús Dinámicos */
        .menu-tabs-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            overflow-x: auto;
            padding-bottom: 5px;
            border-bottom: 1px solid var(--ad-borde);
        }
        .tab-btn {
            background: #191426;
            border: 1px solid var(--ad-borde);
            color: var(--ad-gris);
            padding: 10px 20px;
            font-size: 0.9rem;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .tab-btn:hover, .tab-btn.active {
            background: var(--ad-accent);
            color: #000;
            border-color: var(--ad-accent);
        }

        /* Bloque de Consola de Administración (Grid de Creadores) */
        .admin-zone {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-bottom: 40px;
            display: none; /* Oculto sin login */
        }
        @media (min-width: 850px) { .admin-zone { grid-template-columns: 1fr 2fr; } }

        .admin-panel {
            background: var(--ad-card);
            border: 1px dashed var(--ad-accent);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }
        .panel-title {
            margin: 0 0 15px 0;
            font-size: 1.1rem;
            color: var(--ad-accent);
            text-transform: uppercase;
            font-weight: 800;
            border-bottom: 1px solid var(--ad-borde);
            padding-bottom: 8px;
        }

        /* Formularios */
        .form-group { margin-bottom: 12px; }
        label { font-size: 0.75rem; font-weight: 700; color: var(--ad-gris); display: block; margin-bottom: 4px; text-transform: uppercase; }
        input, select, textarea {
            width: 100%; padding: 10px; background: #09060f; border: 1px solid var(--ad-borde);
            border-radius: 6px; color: #fff; box-sizing: border-box; outline: none; font-family: inherit;
        }
        input:focus, select:focus, textarea:focus { border-color: var(--ad-accent); }

        /* Contenedor dinámico de botones dentro de la publicación */
        .dynamic-buttons-creator {
            background: #09060f; border: 1px solid var(--ad-borde); padding: 10px; border-radius: 6px; margin-bottom: 15px;
        }
        .button-row { display: flex; gap: 8px; margin-bottom: 8px; }

        .btn {
            padding: 10px 15px; font-weight: 700; border-radius: 6px; cursor: pointer; border: none; font-size: 0.85rem; text-transform: uppercase; transition: opacity 0.2s;
        }
        .btn-accent { background: var(--ad-accent); color: #000; }
        .btn-action { background: #221a33; color: var(--ad-accent); border: 1px solid rgba(168, 85, 247, 0.2); }
        .btn-danger { background: rgba(239, 68, 68, 0.15); color: var(--ad-rojo); border: 1px solid rgba(239, 68, 68, 0.3); }
        .btn:hover { opacity: 0.9; }

        /* Feed General de Contenido */
        .content-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 25px;
        }
        @media (min-width: 768px) { .content-layout { grid-template-columns: repeat(2, 1fr); } }

        /* Tarjeta Estilo Split */
        .post-card {
            background: var(--ad-card); border: 1px solid var(--ad-borde); border-radius: 12px; padding: 22px;
            position: relative; box-shadow: 0 8px 20px rgba(0,0,0,0.3); display: flex; flex-direction: column; justify-content: space-between;
        }
        .post-main { display: flex; gap: 15px; justify-content: space-between; align-items: flex-start; }
        .post-text { flex: 1; }
        .post-title { font-size: 1.3rem; margin: 0 0 6px 0; color: #fff; font-weight: 700; }
        .post-subtitle { font-size: 0.95rem; color: var(--ad-gris); margin: 0 0 12px 0; line-height: 1.4; }
        .post-body { font-size: 0.9rem; color: #d1d5db; line-height: 1.5; white-space: pre-wrap; margin-bottom: 15px; }
        
        .post-img { width: 120px; height: 90px; border-radius: 6px; overflow: hidden; flex-shrink: 0; border: 1px solid var(--ad-borde); }
        .post-img img { width: 100%; height: 100%; object-fit: cover; }

        /* Bloque de Links creados */
        .post-links-area { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; padding-top: 15px; border-top: 1px dashed var(--ad-borde); }
        .custom-link-btn {
            background: var(--ad-accent-dim, rgba(168, 85, 247, 0.12)); color: #c084fc; border: 1px solid rgba(168, 85, 247, 0.25);
            padding: 6px 14px; border-radius: 6px; font-size: 0.8rem; font-weight: 700; text-decoration: none; text-align: center; transition: all 0.2s;
        }
        .custom-link-btn:hover { background: var(--ad-accent); color: #000; border-color: var(--ad-accent); }

        .btn-delete-item { position: absolute; top: 15px; right: 15px; z-index: 10; }

        /* Login */
        .btn-login { background: transparent; border: 1px solid rgba(168, 85, 247, 0.4); color: var(--ad-accent); padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 600; }
        .btn-login:hover { background: var(--ad-accent); color: #000; }
    </style>
</head>
<body onload="inicializarNexusHub()">

    <header class="nexus-header">
        <div>
            <a href="/" class="brand-logo">Adro<span>games</span></a>
            <div class="sub-logo">NEXUS CORE SYSTEM</div>
        </div>
        <div id="auth-status">
            <button class="btn-login" onclick="abrirLoginMaster()">Staff Login</button>
        </div>
    </header>

    <div class="container">

        <nav class="menu-tabs-bar" id="nexus-dynamic-tabs">
            </nav>

        <div class="admin-zone" id="nexus-admin-zone">
            
            <div class="admin-panel">
                <h3 class="panel-title">🛠️ 1. Creador de Menús (Rutas)</h3>
                <div class="form-group">
                    <label>Nombre Visual del Menú</label>
                    <input type="text" id="new-menu-name" placeholder="Ej: Proyectos, Más, Empleos">
                </div>
                <div class="form-group">
                    <label>Icono / Emoji</label>
                    <input type="text" id="new-menu-icon" placeholder="Ej: 🚀, ➕, 🏢">
                </div>
                <button class="btn btn-accent" style="width:100%; margin-top:5px;" onclick="crearMenuNuevo()">📁 Crear Menú Nuevo</button>
                
                <div style="margin-top: 15px;" id="delete-current-menu-box">
                    </div>
            </div>

            <div class="admin-panel">
                <h3 class="panel-title">✍️ 2. Creador de Publicaciones en Menú Activo</h3>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
                    <div class="form-group">
                        <label>Título Primario</label>
                        <input type="text" id="post-title" placeholder="Nombre o Título principal">
                    </div>
                    <div class="form-group">
                        <label>Subtítulo / Copete</label>
                        <input type="text" id="post-subtitle" placeholder="Subtítulo corto descriptivo">
                    </div>
                </div>
                <div class="form-group">
                    <label>Enlace de Imagen / Miniatura (URL)</label>
                    <input type="text" id="post-photo" placeholder="https://adrogames.com/img/foto.jpg">
                </div>
                <div class="form-group">
                    <label>Cuerpo / Descripción Extendida</label>
                    <textarea id="post-body" rows="3" placeholder="Información detallada..."></textarea>
                </div>

                <label style="color:var(--ad-accent); margin-bottom:8px;">🔗 Generador de Botones con Link Externo</label>
                <div class="dynamic-buttons-creator">
                    <div id="dynamic-links-inputs-area">
                        </div>
                    <button class="btn btn-action" style="font-size:0.75rem; padding:6px 12px;" onclick="agregarFilaDeBotonLink()">➕ Añadir Fila de Botón</button>
                </div>

                <button class="btn btn-accent" style="width:100%; background:var(--ad-verde); color:#000;" onclick="publicarEnMenuActivo()">🚀 Lanzar Publicación al Menú</button>
            </div>

        </div>

        <main class="content-layout" id="nexus-content-display">
            </main>

    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyA58MXpItx1F9zNnJbyeS_4FT_onYx9wig", authDomain: "uqt-virtual.firebaseapp.com", projectId: "uqt-virtual", storageBucket: "uqt-virtual.appspot.com", messagingSenderId: "777641217730", appId: "1:777641217730:web:8c5b5f9b4c7d8e2a" };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let esAdmin = false;
        const CONFIG_ADMIN = "admin@mercadogato.com";
        
        let listaMenusGlobal = [];
        let menuSeleccionadoId = ""; 

        function inicializarNexusHub() {
            auth.onAuthStateChanged(user => {
                const zone = document.getElementById('nexus-admin-zone');
                const authStatus = document.getElementById('auth-status');
                
                if(user && user.email.toLowerCase() === CONFIG_ADMIN.toLowerCase()) {
                    esAdmin = true;
                    zone.style.display = 'grid';
                    authStatus.innerHTML = `<span style="color:var(--ad-rojo); font-weight:700; font-size:0.8rem; margin-right:10px;">🔴 ADMIN CORE</span><button class="btn-login" onclick="auth.signOut()" style="background:var(--ad-rojo); color:#fff; border:none;">Cerrar</button>`;
                } else {
                    esAdmin = false;
                    zone.style.display = 'none';
                    authStatus.innerHTML = `<button class="btn-login" onclick="abrirLoginMaster()">Staff Login</button>`;
                }
                cargarMenusDesdeServidor();
            });
        }

        // --- SISTEMA 1: GESTIÓN DE MENÚS (RUTAS) ---
        function cargarMenusDesdeServidor() {
            db.collection('nexus_menus').orderBy('creacion', 'asc').onSnapshot(snap => {
                listaMenusGlobal = [];
                const tabsBar = document.getElementById('nexus-dynamic-tabs');
                tabsBar.innerHTML = "";

                // Inyección inicial manual de las dos rutas fijadas por orden corporativo si la DB está vacía
                if (snap.empty) {
                    inyectarMenusFijosIniciales();
                    return;
                }

                snap.forEach(doc => {
                    const m = doc.data();
                    listaMenusGlobal.push({ id: doc.id, ...m });
                });

                if(!menuSeleccionadoId && listaMenusGlobal.length > 0) {
                    menuSeleccionadoId = listaMenusGlobal[0].id;
                }

                listaMenusGlobal.forEach(menu => {
                    const activeClass = menu.id === menuSeleccionadoId ? 'active' : '';
                    tabsBar.innerHTML += `<button class="tab-btn ${activeClass}" onclick="cambiarDeMenu('${menu.id}')">${menu.icono} ${menu.nombre}</button>`;
                });

                actualizarBotonEliminarMenu();
                cargarPublicacionesDeMenu();
            });
        }

        function inyectarMenusFijosIniciales() {
            const batch = db.batch();
            const r1 = db.collection('nexus_menus').doc();
            batch.set(r1, { nombre: "TransportN", icono: "🚍", creacion: firebase.firestore.FieldValue.serverTimestamp() });
            const r2 = db.collection('nexus_menus').doc();
            batch.set(r2, { nombre: "BancoGato", icono: "🏦", creacion: firebase.firestore.FieldValue.serverTimestamp() });
            batch.commit().then(() => cargarMenusDesdeServidor());
        }

        function cambiarDeMenu(idMenu) {
            menuSeleccionadoId = idMenu;
            const btns = document.querySelectorAll('.tab-btn');
            cargarMenusDesdeServidor();
        }

        function crearMenuNuevo() {
            const nombre = document.getElementById('new-menu-name').value.trim();
            const icono = document.getElementById('new-menu-icon').value.trim() || "📁";

            if(!nombre) return alert("Escribí el nombre del menú/sección.");

            db.collection('nexus_menus').add({
                nombre: nombre,
                icono: icono,
                creacion: firebase.firestore.FieldValue.serverTimestamp()
            }).then((docRef) => {
                document.getElementById('new-menu-name').value = "";
                document.getElementById('new-menu-icon').value = "";
                menuSeleccionadoId = docRef.id; 
                alert("¡Menú creado y activado!");
            });
        }

        function eliminarMenuCompleto() {
            const menuObj = listaMenusGlobal.find(m => m.id === menuSeleccionadoId);
            if(!menuObj) return;

            if(confirm(`⚠️ ALERTA CORPORATIVA:\n¿Estás seguro de eliminar el menú "${menuObj.nombre}"? Esto también borrará todas las publicaciones indexadas en él.`)) {
                // Borrar publicaciones asociadas primero
                db.collection('nexus_publicaciones').where('menuId', '==', menuSeleccionadoId).get().then(snap => {
                    const batch = db.batch();
                    snap.forEach(doc => batch.delete(doc.ref));
                    batch.delete(db.collection('nexus_menus').doc(menuSeleccionadoId));
                    
                    batch.commit().then(() => {
                        alert("Menú y contenidos purgados del servidor Nexus.");
                        menuSeleccionadoId = "";
                        cargarMenusDesdeServidor();
                    });
                });
            }
        }

        function actualizarBotonEliminarMenu() {
            const contenedor = document.getElementById('delete-current-menu-box');
            if(!esAdmin || !menuSeleccionadoId) { contenedor.innerHTML = ""; return; }
            const menuObj = listaMenusGlobal.find(m => m.id === menuSeleccionadoId);
            if(menuObj) {
                contenedor.innerHTML = `<button class="btn btn-danger" style="width:100%; font-size:0.75rem;" onclick="eliminarMenuCompleto()">❌ Eliminar Menú: ${menuObj.nombre}</button>`;
            }
        }

        // --- SISTEMA 2: LINK DINÁMICOS EN PUBLICACIONES ---
        function agregarFilaDeBotonLink() {
            const contenedor = document.getElementById('dynamic-links-inputs-area');
            const div = document.createElement('div');
            div.className = "button-row";
            div.innerHTML = `
                <input type="text" placeholder="Texto del Botón" class="link-btn-text" style="flex:1;">
                <input type="text" placeholder="https://enlace.com" class="link-btn-url" style="flex:2;">
                <button class="btn btn-danger" style="padding:5px 10px;" onclick="this.parentNode.remove()">✕</button>
            `;
            contenedor.appendChild(div);
        }

        // --- SISTEMA 3: PUBLICACIONES ---
        function publicarEnMenuActivo() {
            if(!menuSeleccionadoId) return alert("No hay un menú seleccionado activo.");
            
            const titulo = document.getElementById('post-title').value.trim();
            const subtitulo = document.getElementById('post-subtitle').value.trim();
            const fotoUrl = document.getElementById('post-photo').value.trim();
            const cuerpo = document.getElementById('post-body').value.trim();

            if(!titulo || !cuerpo) return alert("El título y la descripción son campos mandatorios.");

            // Recolectar array de botones con link estructurados
            const botones = [];
            const filasText = document.querySelectorAll('.link-btn-text');
            const filasUrl = document.querySelectorAll('.link-btn-url');

            filasText.forEach((el, index) => {
                const txt = el.value.trim();
                const url = filasUrl[index].value.trim();
                if(txt && url) {
                    botones.push({ texto: txt, link: url });
                }
            });

            db.collection('nexus_publicaciones').add({
                menuId: menuSeleccionadoId,
                titulo: titulo,
                subtitulo: subtitulo,
                fotoUrl: fotoUrl,
                cuerpo: cuerpo,
                botonesLink: botones, // Array de sub-botones con links
                fecha: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                document.getElementById('post-title').value = "";
                document.getElementById('post-subtitle').value = "";
                document.getElementById('post-photo').value = "";
                document.getElementById('post-body').value = "";
                document.getElementById('dynamic-links-inputs-area').innerHTML = "";
                alert("Publicación corporativa desplegada de manera exitosa.");
                cargarPublicacionesDeMenu();
            });
        }

        function cargarPublicacionesDeMenu() {
            const display = document.getElementById('nexus-content-display');
            if(!menuSeleccionadoId) {
                display.innerHTML = `<div style="color:var(--ad-gris); text-align:center; width:100%; padding:20px;">Crea un menú para comenzar.</div>`;
                return;
            }

            db.collection('nexus_publicaciones')
              .where('menuId', '==', menuSeleccionadoId)
              .orderBy('fecha', 'desc')
              .get()
              .then(snap => {
                  display.innerHTML = "";
                  
                  if(snap.empty) {
                      display.innerHTML = `<div style="grid-column: 1 / -1; text-align:center; color:var(--ad-gris); padding:40px;">No hay registros publicados en este módulo del Nexus.</div>`;
                      return;
                  }

                  snap.forEach(doc => {
                      const p = doc.data();
                      
                      const botonBorrado = esAdmin ? `<button class="btn btn-danger btn-delete-item" onclick="eliminarPublicacion('${doc.id}')">❌ Borrar</button>` : '';
                      const imgBlock = p.fotoUrl ? `<div class="post-img"><img src="${p.fotoUrl}" onerror="this.parentNode.style.display='none'"></div>` : '';

                      // Procesamiento del array de botones links customizados
                      let areaBotonesLinks = "";
                      if(p.botonesLink && p.botonesLink.length > 0) {
                          areaBotonesLinks = `<div class="post-links-area">`;
                          p.botonesLink.forEach(b => {
                              areaBotonesLinks += `<a href="${b.link}" target="_blank" class="custom-link-btn">${b.texto}</a>`;
                          });
                          areaBotonesLinks += `</div>`;
                      }

                      display.innerHTML += `
                          <article class="post-card">
                              <div>
                                  ${botonBorrado}
                                  <div class="post-main">
                                      <div class="post-text">
                                          <h2 class="post-title">${p.titulo}</h2>
                                          ${p.subtitulo ? `<p class="post-subtitle">${p.subtitulo}</p>` : ''}
                                      </div>
                                      ${imgBlock}
                                  </div>
                                  <div class="post-body">${p.cuerpo}</div>
                              </div>
                              ${areaBotonesLinks}
                          </article>
                      `;
                  });
              });
        }

        function eliminarPublicacion(idPost) {
            if(confirm("¿Remover esta publicación permanentemente de este menú?")) {
                db.collection('nexus_publicaciones').doc(idPost).delete().then(() => {
                    alert("Publicación purgada.");
                    cargarPublicacionesDeMenu();
                });
            }
        }

        function abrirLoginMaster() {
            const email = prompt("Credencial de Acceso Staff:");
            if(!email) return;
            const pass = prompt("Clave Encriptada:");
            if(!pass) return;
            auth.signInWithEmailAndPassword(email, pass).catch(e => alert("Error de Autenticación: " + e.message));
        }
    </script>
</body>
</html>
